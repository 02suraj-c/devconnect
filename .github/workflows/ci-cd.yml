name: CI/CD

# Runs on every push/PR to main: installs both apps, builds the frontend,
# and (on a push to main only) triggers the Vercel + Render deploy hooks.
# Vercel/Render also auto-deploy on their own git integration; this
# workflow is what gives you the "green check" CI gate + an explicit,
# auditable deploy step.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend - install & smoke test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - run: npm install
      - run: npm test

  frontend:
    name: Frontend - install & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm install
      - run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_SOCKET_URL: ${{ secrets.VITE_SOCKET_URL }}

  deploy:
    name: Trigger deploy hooks
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      # Render: create a "Deploy Hook" URL in the Render dashboard for the
      # devconnect-api service and store it as a repo secret.
      - name: Deploy backend to Render
        run: curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

      # Vercel deploys automatically on push via its GitHub integration,
      # so no explicit step is required here unless you disable that and
      # want to trigger it manually with the Vercel CLI + VERCEL_TOKEN.
