# Render "Blueprint" — commit this at the repo root (or backend/ if it's
# a separate repo) and use "New + > Blueprint" on Render to auto-provision.
services:
  - type: web
    name: devconnect-api
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false # set manually in the Render dashboard (secret)
      - key: JWT_SECRET
        sync: false # set manually in the Render dashboard (secret)
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        value: https://devconnect.vercel.app # replace with your real Vercel URL
