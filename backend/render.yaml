# ──────────────────────────────────────────────────────────────────────
# Render Blueprint for DevConnect Backend
#
# Render reads this file when you create a "Blueprint" and provisions
# the service automatically. Secret env vars (MONGO_URI, JWT_SECRET)
# should be set in the Render dashboard — they're listed here as
# placeholders so Render knows to prompt for them.
# ──────────────────────────────────────────────────────────────────────

services:
  - type: web
    name: devconnect-api
    runtime: node
    region: oregon

    # Render clones the whole repo; rootDir scopes it to the backend.
    rootDir: backend

    buildCommand: npm install
    startCommand: npm start

    # Render hits this path to decide if the deploy is healthy.
    healthCheckPath: /api/health

    envVars:
      - key: NODE_ENV
        value: production

      # Update this to your real Vercel URL once you have it.
      - key: CLIENT_URL
        value: https://devconnect.vercel.app

      # Secrets — set the actual values in the Render dashboard.
      - key: MONGO_URI
        sync: false          # tells Render to prompt for the value
      - key: JWT_SECRET
        sync: false
